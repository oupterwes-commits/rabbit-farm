name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p www/icons assets
          mv index.html manifest.webmanifest sw.js www/
          mv icon-192.png icon-512.png www/icons/
          mv icon-only.png assets/
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Add notification permissions
        run: |
          f=android/app/src/main/AndroidManifest.xml
          for p in POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED; do grep -q "android.permission.$p" $f || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" $f; done
      - run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rabbit-farm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
